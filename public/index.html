<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>轻量指纹浏览器</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="dot"></span>
    <h1>轻量指纹浏览器</h1>
    <span class="ver" id="browserVer">读取内核中…</span>
  </div>
  <div class="actions">
    <input id="search" class="search" type="search" placeholder="搜索名称 / 分组 / 代理…" />
    <select id="groupFilter" class="group-filter"><option value="">全部分组</option></select>
    <button class="btn ghost" id="btnExport">导出</button>
    <button class="btn ghost" id="btnImport">导入</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
    <button class="btn ghost" id="btnRefresh">刷新</button>
    <button class="btn ghost danger" id="btnQuit" title="关闭所有环境并退出控制台">退出</button>
    <button class="btn" id="btnBatchNew">批量新建</button>
    <button class="btn primary" id="btnNew">+ 新建环境</button>
  </div>
</header>

<main>
  <section class="hint" id="hint"></section>
  <section class="batch-bar" id="batchBar" hidden>
    <label><input type="checkbox" id="chkSelectAll" /> 全选当前列表</label>
    <span class="batch-count" id="batchCount">已选 0 个</span>
    <button class="btn primary" id="btnBatchLaunch" disabled>批量启动</button>
    <button class="btn" id="btnBatchStop" disabled>批量关闭</button>
    <button class="btn danger" id="btnBatchDelete" disabled>批量删除</button>
  </section>
  <section class="grid" id="grid"></section>
  <section class="empty" id="empty" hidden>
    <p>还没有环境。</p>
    <p>点右上角「新建环境」，每个环境有独立的 Cookie 存储、独立的指纹、独立的代理。</p>
  </section>
</main>

<!-- 环境编辑 -->
<dialog id="editor">
  <form method="dialog" id="editorForm">
    <h2 id="editorTitle">新建环境</h2>

    <div class="row">
      <label>名称
        <input name="name" placeholder="例如 店铺A-美国" required />
      </label>
      <label>分组
        <input name="group" placeholder="例如 美国-店铺" />
      </label>
    </div>
    <div class="row">
      <label>起始页
        <input name="startUrl" placeholder="about:blank" />
      </label>
      <label>备注
        <input name="notes" placeholder="店铺名 / 账号用途 / 负责人" />
      </label>
    </div>

    <h3>指纹
      <button type="button" class="btn tiny" id="btnRandom">随机一套</button>
    </h3>

    <label class="full">地区预设（可选，一键对齐平台 / 时区 / 语言 / 显卡）
      <select name="presetKey" id="presetSelect">
        <option value="">自定义</option>
      </select>
    </label>

    <div class="row">
      <label>系统平台
        <select name="platform">
          <option value="win">Windows</option>
          <option value="mac">macOS</option>
          <option value="linux">Linux</option>
        </select>
      </label>
      <label>时区
        <input name="timezone" placeholder="Asia/Shanghai" list="tzList" />
      </label>
    </div>
    <datalist id="tzList"></datalist>

    <div class="row">
      <label>语言（逗号分隔，第一个为主语言）
        <input name="languages" placeholder="zh-CN,zh,en-US,en" />
      </label>
      <label>Locale
        <input name="locale" placeholder="zh-CN" />
      </label>
    </div>

    <div class="row four">
      <label>屏宽<input name="screenWidth" type="number" /></label>
      <label>屏高<input name="screenHeight" type="number" /></label>
      <label>可用高<input name="screenAvailHeight" type="number" /></label>
      <label>DPR<input name="pixelRatio" type="number" step="0.25" /></label>
    </div>

    <div class="row four">
      <label>CPU 核数<input name="hardwareConcurrency" type="number" /></label>
      <label>内存 GB<input name="deviceMemory" type="number" min="1" max="8" title="规范上限是 8" /></label>
      <label>触点数<input name="maxTouchPoints" type="number" /></label>
      <label>色深<input name="colorDepth" type="number" /></label>
    </div>

    <div class="row">
      <label>WebGL 厂商<input name="webglVendor" /></label>
      <label>WebGL 渲染器<input name="webglRenderer" /></label>
    </div>

    <div class="row">
      <label>User-Agent 模式
        <select name="userAgentMode">
          <option value="auto">自动（跟随本机内核版本号）</option>
          <option value="custom">自定义</option>
        </select>
      </label>
      <label>WebRTC
        <select name="webrtc">
          <option value="proxy">跟随代理（改写候选地址）</option>
          <option value="disabled">禁用（不产生候选地址）</option>
          <option value="real">不处理（可能泄漏真实 IP）</option>
        </select>
      </label>
    </div>

    <label class="full" id="uaWrap">自定义 UA
      <input name="userAgentCustom" placeholder="留空则自动生成" />
    </label>

    <div class="checks">
      <label><input type="checkbox" name="canvasNoise" /> Canvas 噪声</label>
      <label><input type="checkbox" name="audioNoise" /> Audio 噪声</label>
      <label><input type="checkbox" name="textNoise" /> 字体测量噪声</label>
      <label><input type="checkbox" name="fontNoise" /> 字体列表伪装（按声明平台过滤）</label>
      <label><input type="checkbox" name="rectNoise" /> 元素坐标噪声（进阶，可能影响布局判断）</label>
    </div>

    <h3>代理
      <button type="button" class="btn tiny" id="btnSyncGeo">测代理并对齐地区</button>
    </h3>
    <label class="full">一键识别代理串（可选，粘贴后自动拆分）
      <input id="proxyQuick" placeholder="如 socks5://user:pass@1.2.3.4:1080 或 host:port:user:pass" autocomplete="off" />
    </label>
    <div class="row">
      <label>类型
        <select name="proxyType">
          <option value="none">不使用</option>
          <option value="http">HTTP 代理</option>
          <option value="https">HTTPS 代理</option>
          <option value="socks5">SOCKS5</option>
        </select>
      </label>
      <label>主机
        <input name="proxyHost" placeholder="127.0.0.1" />
      </label>
    </div>
    <div class="row">
      <label>端口<input name="proxyPort" placeholder="7890" /></label>
      <label>用户名<input name="proxyUsername" autocomplete="off" /></label>
      <label>密码<input name="proxyPassword" type="password" autocomplete="new-password" /></label>
    </div>
    <div class="checks">
      <label><input type="checkbox" name="autoGeo" /> 启动时按代理出口自动同步时区 / 语言 / 经纬度</label>
    </div>

    <footer>
      <span class="err" id="editorErr"></span>
      <button type="button" class="btn ghost" id="btnCancel">取消</button>
      <button type="button" class="btn primary" id="btnSave">保存</button>
    </footer>
  </form>
</dialog>

<!-- 指纹检测结果 -->
<dialog id="report">
  <h2>指纹检测结果</h2>
  <div id="reportBody" class="report"></div>
  <footer>
    <button type="button" class="btn ghost" id="btnCloseReport">关闭</button>
  </footer>
</dialog>

<!-- 代理检测结果 -->
<dialog id="proxyDlg">
  <h2>代理检测</h2>
  <div id="proxyBody" class="report"></div>
  <footer>
    <button type="button" class="btn ghost" id="btnCloseProxy">关闭</button>
  </footer>
</dialog>

<!-- 批量新建环境 -->
<dialog id="batchDlg">
  <form method="dialog" id="batchForm">
    <h2>批量新建环境</h2>
    <div class="row">
      <label>地区预设
        <select id="batchPreset">
          <option value="">默认随机</option>
        </select>
      </label>
      <label>名称前缀
        <input id="batchName" placeholder="例如 美国店铺（自动加 -1 -2）" />
      </label>
    </div>
    <div class="row">
      <label>分组
        <input id="batchGroup" placeholder="留空则默认使用预设名称" />
      </label>
      <label>数量
        <input id="batchCountInput" type="number" min="1" max="100" placeholder="留空则等于代理条数" />
      </label>
    </div>
    <label class="full">代理列表（每行一条，支持 http://u:p@h:p / socks5://... / h:p:u:p，与环境一对一）
      <textarea id="batchProxies" rows="5" placeholder="留空表示全部直连&#10;http://user:pass@1.2.3.4:8080&#10;socks5://user:pass@5.6.7.8:1080"></textarea>
    </label>
    <div class="checks">
      <label><input type="checkbox" id="batchAutoGeo" /> 启动时按代理出口自动同步时区 / 语言 / 经纬度</label>
    </div>
    <footer>
      <span class="err" id="batchErr"></span>
      <button type="button" class="btn ghost" id="btnCancelBatch">取消</button>
      <button type="button" class="btn primary" id="btnSubmitBatch">创建</button>
    </footer>
  </form>
</dialog>

<!-- Cookie 导入导出 -->
<dialog id="cookieDlg">
  <h2 id="cookieTitle">Cookie 管理</h2>
  <div class="row" style="margin-bottom: 12px; align-items: center;">
    <span id="cookieInfo" style="color: var(--muted); font-size: 13px;">正在读取 Cookie…</span>
    <div style="display: flex; gap: 8px; justify-content: flex-end;">
      <button type="button" class="btn" id="btnCopyCookies">导出并复制 JSON</button>
      <button type="button" class="btn" id="btnDownloadCookies">下载 Cookie JSON</button>
    </div>
  </div>
  <label class="full">导入 Cookie（支持 EditThisCookie JSON 数组或 Netscape 格式文本）
    <textarea id="cookieText" rows="7" placeholder="粘贴 JSON 数组（EditThisCookie）或 Netscape 格式文本…"></textarea>
  </label>
  <input type="file" id="cookieFile" accept=".json,.txt,application/json,text/plain" hidden />
  <footer>
    <button type="button" class="btn ghost" id="btnPickCookieFile">从文件读取</button>
    <span class="err" id="cookieErr"></span>
    <button type="button" class="btn ghost" id="btnCloseCookie">关闭</button>
    <button type="button" class="btn primary" id="btnImportCookies">导入 Cookie</button>
  </footer>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
